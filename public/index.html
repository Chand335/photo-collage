<!DOCTYPE html>
<html class="h-full bg-slate-100" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Photo Collage Maker - Mobile App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
            }
          },
          boxShadow: {
            'ios-subtle': '0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03)',
            'ios-card': '0 4px 16px -2px rgba(0, 0, 0, 0.05)',
            'sticky-bar': '0 -4px 20px -2px rgba(15, 23, 42, 0.06)'
          }
        }
      }
    }
  </script>

  <style>
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .tap-effect {
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .tap-effect:active {
      transform: scale(0.97);
      opacity: 0.9;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen bg-[#F2F2F7] text-slate-900 pb-32">

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-40 bg-white/85 backdrop-blur-xl border-b border-slate-200/80 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-700 to-brand-500 flex items-center justify-center text-white shadow-sm shadow-brand-600/30">
          <i class="ph-bold ph-grid-four text-lg"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-slate-900">Photo Collage Maker</h1>
          <p class="text-[11px] font-medium text-slate-500">Instant in-browser PDF export</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="reset-all-btn" title="Reset All" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 tap-effect" type="button">
          <i class="ph ph-arrow-counter-clockwise text-base"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-md mx-auto w-full px-4 pt-4 flex-1 flex flex-col gap-4">

    <!-- Collage Heading Section -->
    <section class="bg-white rounded-2xl p-4 shadow-ios-subtle border border-slate-200/70">
      <div class="flex items-center justify-between mb-2">
        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400" for="collage-heading-input">Collage Title</label>
        <span class="text-[11px] font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full flex items-center gap-1">
          <i class="ph-bold ph-check"></i> Cover Heading
        </span>
      </div>
      <div class="relative flex items-center">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <i class="ph-bold ph-text-t text-base"></i>
        </div>
        <input 
          id="collage-heading-input" 
          class="w-full pl-10 pr-9 py-2.5 text-sm font-medium text-slate-900 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-600/20 focus:border-brand-600 transition-all placeholder:text-slate-400" 
          placeholder="e.g. Seven Wonders of the Modern World" 
          type="text" 
          value="Seven Wonders of the Modern World"
        />
        <button id="clear-title-btn" aria-label="Clear Title" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600" type="button">
          <i class="ph-fill ph-x-circle text-base"></i>
        </button>
      </div>
    </section>

    <!-- Layout & Grid Style -->
    <section class="bg-white rounded-2xl p-4 shadow-ios-subtle border border-slate-200/70 space-y-2.5">
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Layout & Orientation</span>
        <span class="text-[11px] text-slate-500 font-medium" id="layout-tag">Portrait (2 Columns)</span>
      </div>
      <div class="grid grid-cols-3 gap-2" id="layout-buttons">
        <button data-layout="grid-2" class="layout-btn flex flex-col items-center justify-center p-2 rounded-xl border-2 border-brand-600 bg-brand-50/50 text-brand-700 font-bold text-xs tap-effect" type="button">
          <i class="ph-bold ph-squares-four text-lg mb-0.5"></i>
          <span>2-Column Grid</span>
        </button>
        <button data-layout="strip" class="layout-btn flex flex-col items-center justify-center p-2 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 font-medium text-xs tap-effect" type="button">
          <i class="ph ph-rows text-lg mb-0.5"></i>
          <span>Vertical Strip</span>
        </button>
        <button data-layout="landscape" class="layout-btn flex flex-col items-center justify-center p-2 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 font-medium text-xs tap-effect" type="button">
          <i class="ph ph-device-rotate text-lg mb-0.5"></i>
          <span>Landscape (3 Col)</span>
        </button>
      </div>
    </section>

    <!-- Repeater Items Section -->
    <section class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-2">
          <h2 class="text-sm font-bold text-slate-900 tracking-tight">Collage Items</h2>
          <span id="items-counter" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-200/80 text-slate-700">0 / 12</span>
        </div>
        <button id="add-item-btn" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full bg-brand-600 text-white text-xs font-semibold shadow-sm hover:bg-brand-700 tap-effect" type="button">
          <i class="ph-bold ph-plus text-xs"></i>
          <span>Add Tile</span>
        </button>
      </div>

      <!-- Repeater Container -->
      <div id="collage-items-list" class="space-y-3"></div>

      <!-- Append Tile Button -->
      <button id="add-tile-bottom-btn" class="w-full py-3.5 border-2 border-dashed border-slate-300 hover:border-brand-500 rounded-2xl bg-white/70 hover:bg-white text-slate-600 flex items-center justify-center gap-2 text-xs font-semibold tap-effect transition-colors" type="button">
        <div class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-slate-700">
          <i class="ph-bold ph-plus text-xs"></i>
        </div>
        <span>Append Another Photo Tile</span>
      </button>
    </section>

    <!-- PDF Options -->
    <section class="bg-white rounded-2xl p-4 shadow-ios-subtle border border-slate-200/70 mb-2">
      <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">PDF Output Settings</h3>
      <div class="space-y-2.5 text-xs">
        <label class="flex items-center justify-between cursor-pointer">
          <span class="text-slate-700 font-medium">Render Captions Below Images</span>
          <input id="opt-captions" checked class="rounded text-brand-600 focus:ring-brand-500 h-4 w-4 border-slate-300" type="checkbox"/>
        </label>
        <label class="flex items-center justify-between cursor-pointer">
          <span class="text-slate-700 font-medium">Add White Frame Borders</span>
          <input id="opt-borders" checked class="rounded text-brand-600 focus:ring-brand-500 h-4 w-4 border-slate-300" type="checkbox"/>
        </label>
      </div>
    </section>

  </main>

  <!-- Sticky Bottom Bar -->
  <footer class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-xl border-t border-slate-200 shadow-sticky-bar z-30 px-4 pt-3 pb-4">
    <div class="max-w-md mx-auto space-y-2">
      <div class="flex items-center gap-2.5">
        <button id="preview-btn" class="flex-1 py-3 px-3 rounded-xl bg-slate-100 text-slate-800 text-xs font-bold flex items-center justify-center gap-1.5 tap-effect hover:bg-slate-200 transition-colors" type="button">
          <i class="ph-bold ph-eye text-sm"></i>
          <span>Preview</span>
        </button>
        <button id="generate-pdf-btn" class="flex-[2] py-3 px-4 rounded-xl bg-brand-700 text-white text-xs sm:text-sm font-bold flex items-center justify-center gap-2 shadow-lg shadow-brand-700/25 tap-effect hover:bg-brand-800 transition-colors" type="button">
          <i class="ph-bold ph-file-pdf text-base"></i>
          <span>Generate PDF</span>
          <i class="ph-bold ph-arrow-right text-xs opacity-75"></i>
        </button>
      </div>
      <p class="text-[10px] text-center text-slate-400 font-medium">Processed client-side. Works completely offline on Wasmer.</p>
    </div>
  </footer>

  <!-- Preview Modal -->
  <div id="preview-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-900">Collage Preview</h3>
        <button id="close-modal-btn" class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200">
          <i class="ph-bold ph-x text-sm"></i>
        </button>
      </div>
      <div id="preview-content" class="p-4 overflow-y-auto space-y-3 flex-1 bg-slate-50"></div>
      <div class="p-3 border-t border-slate-100 bg-white flex justify-end">
        <button id="modal-download-btn" class="px-4 py-2 bg-brand-700 text-white rounded-xl text-xs font-bold tap-effect">
          Download PDF
        </button>
      </div>
    </div>
  </div>

  <!-- Repeater Item Template -->
  <template id="item-card-template">
    <article class="collage-item bg-white rounded-2xl p-3.5 shadow-ios-subtle border border-slate-200/80 relative">
      <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-100">
        <div class="flex items-center gap-1.5">
          <span class="item-index-badge w-5 h-5 rounded-md bg-slate-100 text-slate-700 font-bold text-[11px] flex items-center justify-center">1</span>
          <span class="text-xs font-semibold text-slate-600">Tile Card</span>
        </div>
        <button type="button" class="btn-remove inline-flex items-center gap-1 text-[11px] font-semibold text-rose-500 hover:text-rose-700 bg-rose-50 px-2 py-0.5 rounded-lg tap-effect">
          <i class="ph ph-trash text-xs"></i>
          <span>Remove</span>
        </button>
      </div>

      <!-- Caption -->
      <div class="mb-2.5">
        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Caption / Label</label>
        <input class="item-caption-input w-full text-xs font-medium px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-600/20 focus:border-brand-600 transition-all text-slate-800" placeholder="e.g. Chichen Itza, Mexico" type="text" />
      </div>

      <!-- Image Pick -->
      <div>
        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Image File</label>
        <div class="flex items-center justify-between p-2 rounded-xl bg-slate-50 border border-slate-200/90 gap-2.5">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="item-thumb w-11 h-11 rounded-lg bg-slate-200 border border-slate-300 flex-shrink-0 flex items-center justify-center overflow-hidden">
              <i class="ph ph-image text-xl text-slate-400 placeholder-icon"></i>
              <img class="thumb-img hidden w-full h-full object-cover" alt="preview" />
            </div>
            <div class="min-w-0">
              <p class="item-filename text-xs font-semibold text-slate-800 truncate">No image selected</p>
              <p class="item-filesize text-[11px] text-slate-400">JPG, PNG, WebP</p>
            </div>
          </div>
          <label class="cursor-pointer flex-shrink-0 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-700 text-xs font-medium shadow-sm hover:bg-slate-50 tap-effect">
            <span>Choose</span>
            <input accept="image/*" class="item-file-input hidden" type="file" />
          </label>
        </div>
      </div>
    </article>
  </template>

  <script>
    // App State
    let currentLayout = 'grid-2'; // 'grid-2', 'strip', 'landscape'
    const itemsList = document.getElementById('collage-items-list');
    const template = document.getElementById('item-card-template');
    const counter = document.getElementById('items-counter');
    const titleInput = document.getElementById('collage-heading-input');

    // Layout configuration buttons
    document.querySelectorAll('.layout-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.layout-btn').forEach(b => {
          b.className = 'layout-btn flex flex-col items-center justify-center p-2 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 font-medium text-xs tap-effect';
        });
        btn.className = 'layout-btn flex flex-col items-center justify-center p-2 rounded-xl border-2 border-brand-600 bg-brand-50/50 text-brand-700 font-bold text-xs tap-effect';
        currentLayout = btn.dataset.layout;
        
        const tags = {
          'grid-2': 'Portrait (2 Columns)',
          'strip': 'Portrait (1 Column Strip)',
          'landscape': 'Landscape (3 Columns)'
        };
        document.getElementById('layout-tag').textContent = tags[currentLayout];
      });
    });

    // Clear Title
    document.getElementById('clear-title-btn').addEventListener('click', () => {
      titleInput.value = '';
      titleInput.focus();
    });

    // Update Tile Indexes & Count
    function updateItemIndexes() {
      const cards = itemsList.querySelectorAll('.collage-item');
      cards.forEach((card, idx) => {
        card.querySelector('.item-index-badge').textContent = idx + 1;
      });
      counter.textContent = `${cards.length} / 12`;
    }

    // Add Tile Function
    function addTile(initialCaption = '', initialImageSrc = null, initialFileName = '') {
      if (itemsList.children.length >= 12) {
        alert('Maximum of 12 items allowed.');
        return;
      }

      const clone = template.content.cloneNode(true);
      const card = clone.querySelector('.collage-item');
      const captionField = card.querySelector('.item-caption-input');
      const fileInput = card.querySelector('.item-file-input');
      const filenameEl = card.querySelector('.item-filename');
      const filesizeEl = card.querySelector('.item-filesize');
      const thumbImg = card.querySelector('.thumb-img');
      const placeholderIcon = card.querySelector('.placeholder-icon');
      const removeBtn = card.querySelector('.btn-remove');

      captionField.value = initialCaption;

      // Image Change Handler
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            thumbImg.src = event.target.result;
            thumbImg.classList.remove('hidden');
            placeholderIcon.classList.add('hidden');
            filenameEl.textContent = file.name;
            filesizeEl.innerHTML = `<span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1"></span>${(file.size / 1024 / 1024).toFixed(2)} MB · Ready`;
          };
          reader.readAsDataURL(file);
        }
      });

      removeBtn.addEventListener('click', () => {
        card.remove();
        updateItemIndexes();
      });

      itemsList.appendChild(card);
      updateItemIndexes();
    }

    document.getElementById('add-item-btn').addEventListener('click', () => addTile());
    document.getElementById('add-tile-bottom-btn').addEventListener('click', () => addTile());

    // Reset button
    document.getElementById('reset-all-btn').addEventListener('click', () => {
      if (confirm('Clear all collage items?')) {
        itemsList.innerHTML = '';
        addTile('First Wonder');
      }
    });

    // Populate initial items
    const sampleItems = [
      'Great Wall of China',
      'Petra – Jordan',
      'Colosseum – Rome',
      'Chichen Itza – Mexico'
    ];
    sampleItems.forEach(item => addTile(item));

    // Data collection helper
    async function collectCollageData() {
      const title = titleInput.value.trim() || 'Photo Collage';
      const cards = itemsList.querySelectorAll('.collage-item');
      const items = [];

      for (const card of cards) {
        const caption = card.querySelector('.item-caption-input').value.trim();
        const img = card.querySelector('.thumb-img');
        const hasImage = !img.classList.contains('hidden') && img.src;

        items.push({
          caption,
          imgSrc: hasImage ? img.src : null
        });
      }

      return { title, items };
    }

    // Modal Preview Handler
    const modal = document.getElementById('preview-modal');
    const previewContent = document.getElementById('preview-content');

    document.getElementById('preview-btn').addEventListener('click', async () => {
      const { title, items } = await collectCollageData();
      previewContent.innerHTML = '';

      const heading = document.createElement('h2');
      heading.className = 'text-center font-bold text-slate-800 text-sm py-1 border-b pb-2';
      heading.textContent = title;
      previewContent.appendChild(heading);

      const grid = document.createElement('div');
      grid.className = currentLayout === 'strip' ? 'grid grid-cols-1 gap-3' : (currentLayout === 'landscape' ? 'grid grid-cols-3 gap-2' : 'grid grid-cols-2 gap-2');

      items.forEach(item => {
        const cell = document.createElement('div');
        cell.className = 'bg-white p-2 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center';

        if (item.imgSrc) {
          const img = document.createElement('img');
          img.src = item.imgSrc;
          img.className = 'w-full h-24 object-cover rounded-lg mb-1.5';
          cell.appendChild(img);
        } else {
          const placeholder = document.createElement('div');
          placeholder.className = 'w-full h-24 bg-slate-100 rounded-lg flex items-center justify-center text-slate-400 text-xs mb-1.5';
          placeholder.textContent = 'No Image';
          cell.appendChild(placeholder);
        }

        if (item.caption) {
          const lbl = document.createElement('span');
          lbl.className = 'text-[11px] font-semibold text-slate-700 text-center truncate w-full';
          lbl.textContent = item.caption;
          cell.appendChild(lbl);
        }

        grid.appendChild(cell);
      });

      previewContent.appendChild(grid);
      modal.classList.remove('hidden');
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));
    document.getElementById('modal-download-btn').addEventListener('click', () => {
      modal.classList.add('hidden');
      document.getElementById('generate-pdf-btn').click();
    });

    // PDF Generation
    document.getElementById('generate-pdf-btn').addEventListener('click', async () => {
      const generateBtn = document.getElementById('generate-pdf-btn');
      const originalHTML = generateBtn.innerHTML;
      const { title, items } = await collectCollageData();

      const validItems = items.filter(i => i.imgSrc);
      if (validItems.length === 0) {
        alert('Please attach at least one photo before generating your PDF.');
        return;
      }

      generateBtn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-base"></i><span>Creating PDF...</span>`;
      generateBtn.classList.add('pointer-events-none', 'opacity-80');

      try {
        const { jsPDF } = window.jspdf;
        const orientation = currentLayout === 'landscape' ? 'l' : 'p';
        const doc = new jsPDF(orientation, 'mm', 'a4');
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();

        const showCaptions = document.getElementById('opt-captions').checked;
        const addBorders = document.getElementById('opt-borders').checked;

        // Title
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(16);
        doc.setTextColor(24, 24, 27);
        doc.text(title, pageWidth / 2, 16, { align: 'center' });

        // Layout Parameters
        const margin = 14;
        let cols = 2;
        if (currentLayout === 'strip') cols = 1;
        if (currentLayout === 'landscape') cols = 3;

        const gutter = 8;
        const availableWidth = pageWidth - (margin * 2) - ((cols - 1) * gutter);
        const cellWidth = availableWidth / cols;
        const imgHeight = currentLayout === 'strip' ? 55 : (currentLayout === 'landscape' ? 45 : 55);
        const cellHeight = imgHeight + (showCaptions ? 9 : 3);

        let currentX = margin;
        let currentY = 24;
        let colIndex = 0;

        for (const item of validItems) {
          if (currentY + cellHeight > pageHeight - margin) {
            doc.addPage();
            currentY = margin;
            colIndex = 0;
            currentX = margin;
          }

          if (addBorders) {
            doc.setDrawColor(226, 232, 240);
            doc.setFillColor(255, 255, 255);
            doc.roundedRect(currentX, currentY, cellWidth, cellHeight, 2, 2, 'FD');
          }

          // Draw Image
          doc.addImage(item.imgSrc, 'JPEG', currentX + 1.5, currentY + 1.5, cellWidth - 3, imgHeight - 3, undefined, 'FAST');

          // Draw Caption
          if (showCaptions && item.caption) {
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8.5);
            doc.setTextColor(51, 65, 85);
            doc.text(item.caption, currentX + (cellWidth / 2), currentY + imgHeight + 4.5, {
              align: 'center',
              maxWidth: cellWidth - 4
            });
          }

          // Advance Grid
          colIndex++;
          if (colIndex >= cols) {
            colIndex = 0;
            currentX = margin;
            currentY += cellHeight + gutter;
          } else {
            currentX += cellWidth + gutter;
          }
        }

        const safeFilename = title.toLowerCase().replace(/[^a-z0-9]/gi, '_');
        doc.save(`${safeFilename}_collage.pdf`);
      } catch (err) {
        console.error(err);
        alert('An error occurred while compiling the PDF.');
      } finally {
        generateBtn.innerHTML = originalHTML;
        generateBtn.classList.remove('pointer-events-none', 'opacity-80');
      }
    });
  </script>
</body>
</html>
